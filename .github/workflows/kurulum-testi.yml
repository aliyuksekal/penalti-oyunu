name: "Kurulum testi (eski sürümün üstüne güncelleme)"

on:
  workflow_dispatch:
    inputs:
      eski:
        description: "Önce kurulacak eski sürüm etiketi"
        default: "v1.0.39"
      yeni:
        description: "Üstüne kurulacak yeni sürüm etiketi"
        default: "v1.0.45"

jobs:
  kurulum:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 33, 35]
    steps:
      - name: APK'leri indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download "${{ inputs.eski }}" -R "${{ github.repository }}" -p drop-zero.apk -O eski.apk
          gh release download "${{ inputs.yeni }}" -R "${{ github.repository }}" -p drop-zero.apk -O yeni.apk
          ls -la *.apk
          sha256sum *.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde kur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            echo "Android SDK $(adb shell getprop ro.build.version.sdk), ABI $(adb shell getprop ro.product.cpu.abilist)"
            echo "== temiz kurulum (yeni) ==" ; adb install yeni.apk 2>&1 | tail -3 ; adb uninstall com.benim.agiryuk || true
            echo "== eski kurulum ==" ; adb install eski.apk 2>&1 | tail -3
            echo "== yeni sürümü eskinin üstüne ==" ; adb install -r yeni.apk 2>&1 | tail -3
            echo "== paket yöneticisiyle (telefondaki yükleyici gibi) ==" ; adb uninstall com.benim.agiryuk || true ; adb install eski.apk > /dev/null 2>&1
            adb push yeni.apk /data/local/tmp/yeni.apk > /dev/null
            adb shell pm install -r /data/local/tmp/yeni.apk 2>&1 | tail -3
            adb logcat -d | grep -iE "PackageManager|PackageInstaller|INSTALL_|InstallPackageHelper" | tail -25
