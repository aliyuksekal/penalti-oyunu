name: Mixamo GLB ve APK Uretici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-all:
  
    runs-on: ubuntu-latest
    steps:
      - name: 1. Depoyu Cek ve Mixamo Zip Paketi Indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mixamo_raw project build
          gh release download v1 --repo ${{ github.repository }} --dir mixamo_raw
          cd mixamo_raw
          for z in *.zip; do
            if [ -f "$z" ]; then unzip -o "$z"; rm "$z"; fi
          done
          ls -la

      - name: 2. Blender Kur ve GLB Dosyalarini Olustur
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

          python3 -c "
          import bpy
          import os
          import glob

          bpy.ops.wm.read_factory_settings(use_empty=True)

          def make_mat(name, color):
              m = bpy.data.materials.new(name=name)
              m.use_nodes = True
              bsdf = m.node_tree.nodes.get('Principled BSDF')
              if bsdf:
                  bsdf.inputs['Base Color'].default_value = color
                  bsdf.inputs['Roughness'].default_value = 0.8
              return m

          # Futbolcu GLB
          bpy.ops.mesh.primitive_cube_add(size=1.0, location=(0, 0, 0.9))
          obj = bpy.context.active_object
          obj.name = 'FutbolcuMesh'
          obj.data.materials.append(make_mat('Shirt', (1.0, 1.0, 1.0, 1.0)))
          obj.data.materials.append(make_mat('Shorts', (1.0, 1.0, 1.0, 1.0)))
          obj.data.materials.append(make_mat('Socks', (1.0, 1.0, 1.0, 1.0)))
          bpy.ops.export_scene.gltf(filepath='project/futbolcu.glb', export_format='GLB', export_yup=True)

          # Kaleci GLB
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.mesh.primitive_cube_add(size=1.0, location=(0, 0, 0.94))
          obj = bpy.context.active_object
          obj.name = 'KaleciMesh'
          obj.data.materials.append(make_mat('Shirt', (1.0, 1.0, 1.0, 1.0)))
          obj.data.materials.append(make_mat('Shorts', (1.0, 1.0, 1.0, 1.0)))
          obj.data.materials.append(make_mat('Socks', (1.0, 1.0, 1.0, 1.0)))
          bpy.ops.export_scene.gltf(filepath='project/kaleci.glb', export_format='GLB', export_yup=True)

          # Top GLB
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.mesh.primitive_ico_sphere_add(subdivisions=3, radius=0.11, location=(0, 0, 0.11))
          obj = bpy.context.active_object
          obj.name = 'TopMesh'
          obj.data.materials.append(make_mat('BallWhite', (0.95, 0.95, 0.95, 1.0)))
          bpy.ops.export_scene.gltf(filepath='project/top.glb', export_format='GLB', export_yup=True)
          print('GLB DOSYALARI BASARIYLA OLUSTuruldu!')
          "

      - name: 3. Godot 4 Projesini ve Scriptleri Yaz
        run: |
          echo 'config_version=5
          [application]
          config/name="Penalti Ustasi"
          run/main_scene="res://Main.tscn"
          config/features=PackedStringArray("4.3", "Mobile")
          [display]
          window/size/viewport_width=1080
          window/size/viewport_height=1920
          window/handheld/orientation=1
          [rendering]
          renderer/rendering_method="mobile"' > project/project.godot

          echo 'extends Node3D
          var futbolcu
          var kaleci
          var top
          func _ready():
              futbolcu = load("res://futbolcu.glb").instantiate()
              futbolcu.position = Vector3(0, 0, 1.5)
              add_child(futbolcu)
              kaleci = load("res://kaleci.glb").instantiate()
              kaleci.position = Vector3(0, 0, -9.5)
              add_child(kaleci)
              top = load("res://top.glb").instantiate()
              top.position = Vector3(0, 0, 0.5)
              add_child(top)
              color_mesh(futbolcu, Color(0.85, 0.1, 0.15))
              color_mesh(kaleci, Color(0.1, 0.65, 0.25))
          func color_mesh(node, col):
              for c in node.find_children("*", "MeshInstance3D", true, false):
                  var mat = StandardMaterial3D.new()
                  mat.albedo_color = col
                  c.set_surface_override_material(0, mat)' > project/Main.gd

          echo '[gd_scene load_steps=3 format=3]
          [ext_resource type="Script" path="res://Main.gd" id="1_s"]
          [node name="Main" type="Node3D"]
          script = ExtResource("1_s")
          [node name="Camera3D" type="Camera3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 0.94, 0.34, 0, -0.34, 0.94, 0, 2.2, 4.2)' > project/Main.tscn

      - name: 4. Java 17 Kur ve APK Derle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Godot 4 Ile APK Olustur
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$PWD/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

          echo '[preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          export_path="../build/penalti_ustasi.apk"
          [preset.0.options]
          gradle_build/use_gradle_build=false
          architectures/arm64-v8a=true
          package/unique_name="com.aliyuksekal.penaltiustasi"
          package/name="Penalti Ustasi"
          package/signed=true
          keystore/debug="$PWD/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"' > project/export_presets.cfg

          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/

          chmod +x Godot_v4.3-stable_linux.x86_64
          ./Godot_v4.3-stable_linux.x86_64 --headless --path project --import
          ./Godot_v4.3-stable_linux.x86_64 --headless --path project --export-debug "Android" "$PWD/build/penalti_ustasi.apk"

      - name: 6. APK ve GLB Dosyalarini Yayinla
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "Sorunsuz APK ve GLB Dosyalari #${{ github.run_number }}"
          files: |
            build/penalti_ustasi.apk
            project/futbolcu.glb
            project/kaleci.glb
            project/top.glb
