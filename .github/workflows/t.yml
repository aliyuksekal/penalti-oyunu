name: dbg
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          cd /tmp && wget -q "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" && unzip -q Godot_*.zip && sudo mv Godot_v*_linux.x86_64 /usr/local/bin/godot
      - run: |
          godot --headless --path . --import > /dev/null 2>&1 || true
          timeout 60 godot --headless --path . res://test/test.tscn -- --case=touch 2>&1 | grep -E "DBG|ok|HATA|ERROR" | head -30
